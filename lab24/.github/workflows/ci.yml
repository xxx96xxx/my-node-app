name: Lab24 CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lab24/package-lock.json

      - name: Install dependencies
        working-directory: lab24
        run: npm ci

      - name: Run tests
        working-directory: lab24
        run: npm test

      - name: Check JavaScript syntax
        working-directory: lab24
        run: |
          node --check app.js
          node --check db.js
          node --check models/user.js
          node --check controllers/users.js
          node --check controllers/auth.js